name: Keep Render API Warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping fopusha API
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "https://baifo.onrender.com/" >/dev/null
